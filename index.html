<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Match Game</title>
<style>
body{font-family:Arial;background:#fff7ed;text-align:center;padding:20px}
main{max-width:480px;margin:auto;background:white;padding:20px;border-radius:15px}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{height:75px;font-size:28px;background:#ea580c;color:white;border:0;border-radius:9px;cursor:pointer}
.card.open{background:#ffedd5;color:#111827}
button.reset{padding:10px 18px;background:#2563eb;color:white;border:0;border-radius:7px;margin:15px}
</style>
</head>
<body>
<main>
<h1>Memory Match Game</h1>
<p>Moves: <span id="moves">0</span></p>
<div id="board"></div>
<p id="status">Find all matching pairs!</p>
<button class="reset" onclick="startGame()">Restart Game</button>
</main>
<script>
const symbols=["🍎","🍌","🍇","🍒","🍋","🍉","🥝","🍓"];
let cards=[],first=null,locked=false,moves=0,matches=0;
function startGame(){
 cards=[...symbols,...symbols].sort(()=>Math.random()-0.5);
 first=null;locked=false;moves=0;matches=0;
 document.getElementById("moves").textContent=0;
 document.getElementById("status").textContent="Find all matching pairs!";
 const board=document.getElementById("board");
 board.innerHTML="";
 cards.forEach((symbol,index)=>{
  const btn=document.createElement("button");
  btn.className="card";
  btn.textContent="?";
  btn.onclick=()=>flip(btn,symbol,index);
  board.appendChild(btn);
 });
}
function flip(btn,symbol,index){
 if(locked||btn.classList.contains("open")||btn.disabled)return;
 btn.textContent=symbol;
 btn.classList.add("open");
 if(!first){first={btn,symbol};return;}
 moves++;
 document.getElementById("moves").textContent=moves;
 if(first.symbol===symbol){
  first.btn.disabled=true;btn.disabled=true;
  first=null;matches++;
  if(matches===symbols.length)
   document.getElementById("status").textContent="You won in "+moves+" moves!";
 }else{
  locked=true;
  const previous=first.btn;
  first=null;
  setTimeout(()=>{
   previous.textContent="?";btn.textContent="?";
   previous.classList.remove("open");btn.classList.remove("open");
   locked=false;
  },800);
 }
}
startGame();
</script>
</body>
</html>
